<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b7a53">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%230b7a53%27/%3E%3Ctext x=%2750%27 y=%2770%27 font-size=%2762%27 text-anchor=%27middle%27 fill=%27white%27%3ET%3C/text%3E%3C/svg%3E">
<title>TayyariHub Pakistan | تیاری ہب پاکستان</title>
<meta name="description" content="MDCAT، ECAT، CSS اور PPSC کے مفت لیکچرز ایک ہی جگہ۔">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap">
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#16202e;--muted:#5d6b7e;--brand:#0b7a53;--line:#e1e7ef}
@media (prefers-color-scheme:dark){:root{--bg:#0f1620;--card:#18222f;--text:#eaf0f7;--muted:#9aa8ba;--brand:#2fbf8a;--line:#2a3646}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Nastaliq Urdu',Tahoma,sans-serif;line-height:2}
header{background:var(--brand);color:#fff;text-align:center;padding:24px 16px}
header h1{margin:0;font-size:1.5rem}
header p{margin:6px 0 0;font-size:.95rem;opacity:.95}
main{max-width:1000px;margin:0 auto;padding:16px}
input,select{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.chip{flex:none;padding:2px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}
.card h3{margin:0 0 6px;font-size:1rem;line-height:2}
.tag{display:inline-block;font-size:.75rem;color:var(--muted)}
.star{color:#c98a00;font-size:.8rem}
.empty{text-align:center;color:var(--muted);padding:30px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:12px;z-index:9}
#modal.show{display:flex}
.box{background:var(--card);border-radius:14px;width:100%;max-width:720px;padding:14px;max-height:94vh;overflow:auto}
.vid{position:relative;padding-top:56.25%;background:#000;border-radius:10px;overflow:hidden}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.btn{display:inline-block;margin:8px 0 0 8px;padding:2px 16px;border-radius:10px;background:var(--brand);color:#fff;text-decoration:none;border:0;font:inherit;cursor:pointer}
.btn.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.bar .btn{margin:0}
ol{padding-inline-start:20px;margin:6px 0}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px}
</style>
</head>
<body>
<header>
  <h1>TayyariHub Pakistan — تیاری ہب پاکستان</h1>
  <p>MDCAT، ECAT، CSS اور PPSC کے لیکچرز اور نوٹس ایک ہی جگہ</p>
</header>
<main>
  <div class="bar"><a class="btn" id="wa" target="_blank" rel="noopener">واٹس ایپ پر شیئر کریں</a><button class="btn alt" id="a2hs">ہوم سکرین پر شامل کریں</button></div>
  <input id="q" type="search" placeholder="لیکچر تلاش کریں...">
  <div class="chips" id="chips"></div>
  <select id="subj"></select>
  <div class="grid" id="grid"></div>
</main>
<div id="modal"><div class="box" id="box"></div></div>
<footer>یہ سائٹ وزٹرز کی گنتی کے لیے Google Analytics استعمال کرتی ہے۔<br>تمام ویڈیوز یوٹیوب کے اصل چینلز کی ملکیت ہیں۔ ہم صرف لنکس شیئر کرتے ہیں۔</footer>
<script src="data.js"></script>
<script>
if(typeof GA_ID==="string"&&/^G-[A-Z0-9]{6,}$/.test(GA_ID)&&GA_ID!=="G-XXXXXXXXXX"){
  var g=document.createElement("script");g.async=true;g.src="https://www.googletagmanager.com/gtag/js?id="+GA_ID;document.head.appendChild(g);
}
window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}
gtag("js",new Date());if(typeof GA_ID==="string")gtag("config",GA_ID);
function track(n,p){try{gtag("event",n,p)}catch(e){}}
</script>
<script>
var cat="all",qEl=document.getElementById("q"),sEl=document.getElementById("subj"),grid=document.getElementById("grid");
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function plist(u){var m=(u||"").match(/[?&]list=([A-Za-z0-9_-]{10,})/);return m?m[1]:""}
function base(){return location.origin+location.pathname}
function waLink(t,hash){return "https://wa.me/?text="+encodeURIComponent(t+"\n"+base()+(hash||""))}
function vid(u){var m=(u||"").match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/);return m?m[1]:""}
function cats(){var a=["all"];LECTURES.forEach(function(l){if(a.indexOf(l.cat)<0)a.push(l.cat)});return a}
function drawChips(){document.getElementById("chips").innerHTML=cats().map(function(c){return '<button class="chip'+(c===cat?' on':'')+'" data-c="'+esc(c)+'">'+(c==="all"?"تمام":esc(c))+'</button>'}).join("")}
function drawSubj(){var s=["all"];LECTURES.forEach(function(l){if(s.indexOf(l.subject)<0)s.push(l.subject)});sEl.innerHTML=s.map(function(x){return '<option value="'+esc(x)+'">'+(x==="all"?"تمام مضامین":esc(x))+'</option>'}).join("")}
function draw(){
  var q=qEl.value.trim().toLowerCase(),s=sEl.value;
  var list=LECTURES.map(function(l,i){l.i=i;return l}).filter(function(l){
    return (cat==="all"||l.cat===cat)&&(s==="all"||l.subject===s)&&(!q||(l.title+" "+l.teacher+" "+l.subject).toLowerCase().indexOf(q)>=0)
  }).sort(function(a,b){return (b.featured?1:0)-(a.featured?1:0)});
  grid.innerHTML=list.length?list.map(function(l){
    return '<div class="card" data-i="'+l.i+'"><h3>'+esc(l.title)+'</h3><span class="tag">'+esc(l.cat)+' • '+esc(l.subject)+(l.teacher?' • '+esc(l.teacher):'')+'</span>'+(l.featured?' <span class="star">★ نمایاں</span>':'')+'</div>'
  }).join(""):'<div class="empty">کوئی لیکچر نہیں ملا۔</div>';
}
function open_(i){
  var l=LECTURES[i],id=vid(l.url),pl=id?"":plist(l.url);track("lecture_open",{lecture:l.title,category:l.cat,subject:l.subject});var h='<h3>'+esc(l.title)+'</h3>';
  if(pl){
    h+='<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/videoseries?list='+pl+'" allowfullscreen loading="lazy"></iframe></div>';
    h+='<a class="btn alt" target="_blank" rel="noopener" href="https://www.youtube.com/playlist?list='+pl+'">اگر پلے لسٹ نہ چلے تو یوٹیوب پر دیکھیں</a>';
  }else if(id){
    h+='<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/'+id+'" allowfullscreen loading="lazy"></iframe></div>';
    h+='<a class="btn alt" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v='+id+'">اگر ویڈیو نہ چلے تو یوٹیوب پر دیکھیں</a>';
  }else{
    h+='<p>اس لیکچر کا لنک جلد شامل ہوگا۔ فی الحال یوٹیوب پر تلاش کریں:</p><a class="btn" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+encodeURIComponent(l.title)+'">یوٹیوب پر تلاش کریں</a>';
  }
  if(l.notes)h+='<a class="btn" target="_blank" rel="noopener" href="'+esc(l.notes)+'">نوٹس ڈاؤن لوڈ کریں</a>';
  h+='<a class="btn alt" data-s="1" target="_blank" rel="noopener" href="'+waLink(l.title,"#l"+i)+'">واٹس ایپ پر شیئر کریں</a>';
  h+='<button class="btn alt" id="x">بند کریں</button>';
  document.getElementById("box").innerHTML=h;
  document.getElementById("modal").classList.add("show");
  document.getElementById("x").onclick=close_;
}
function close_(){document.getElementById("modal").classList.remove("show");document.getElementById("box").innerHTML=""}
document.getElementById("chips").onclick=function(e){var c=e.target.getAttribute("data-c");if(c){cat=c;drawChips();draw()}};
grid.onclick=function(e){var n=e.target.closest(".card");if(n)open_(+n.getAttribute("data-i"))};
document.getElementById("modal").onclick=function(e){if(e.target.id==="modal")close_();var s=e.target.closest&&e.target.closest("[data-s]");if(s)track("share",{method:"whatsapp",where:"lecture"})};
var wa=document.getElementById("wa");wa.href=waLink("TayyariHub Pakistan: MDCAT, ECAT, CSS, PPSC کے لیکچرز ایک ہی جگہ");wa.onclick=function(){track("share",{method:"whatsapp",where:"site"})};
document.getElementById("a2hs").onclick=function(){
  track("add_to_home_click");
  document.getElementById("box").innerHTML='<h3>ہوم سکرین پر شامل کریں</h3><ol><li>Chrome میں اوپر دائیں تین نقطوں (⋮) کا مینو دبائیں۔</li><li><b>Add to Home screen</b> (یا Install app) چنیں۔</li><li><b>Add</b> دبائیں۔ سائٹ کا آئیکن آپ کی ہوم سکرین پر آ جائے گا۔</li></ol><button class="btn alt" id="x">بند کریں</button>';
  document.getElementById("modal").classList.add("show");document.getElementById("x").onclick=close_;
};
window.addEventListener("hashchange",openFromHash);
qEl.oninput=draw;sEl.onchange=draw;
function openFromHash(){var m=location.hash.match(/^#l(\d+)$/);if(m&&LECTURES[+m[1]])open_(+m[1])}
drawChips();drawSubj();draw();openFromHash();
</script>
</body>
</html>
